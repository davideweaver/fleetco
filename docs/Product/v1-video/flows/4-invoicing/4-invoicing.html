<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invoicing and payments</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="../../lib/wire.css">
<style>
/* handwritten callouts (same look as v1-walkthrough-sample.html) */
.note { font-family: var(--hand); color: var(--pencil); font-size: 19px; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; }
.note .badge { flex: none; width: 26px; height: 26px; border: 1.5px solid var(--pencil); border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 700; }
.notes { position: absolute; display: flex; flex-direction: column; gap: 22px; width: 300px; }
.hint { position: absolute; z-index: 5; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 3px; box-shadow: 4px 4px 0 var(--fill-2); padding: 9px 12px; font-size: 13px; width: 270px; }
.doc { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 3px; box-shadow: 6px 6px 0 var(--fill-2); }
.check { display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--ink); border-radius: 2px; font-size: 11px; line-height: 1; vertical-align: middle; }
.check.on { background: var(--ink); color: var(--paper); }
.flowline { display: flex; align-items: center; gap: 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--fill-2); }
.flowline:last-child { border-bottom: 0; }
.pdfbar { display: flex; justify-content: space-between; align-items: center; width: 820px; font: 12px var(--mono); }
.flowline .arrow { font: 600 18px var(--mono); }
/* email send window + customer's inbox */
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); border-radius: 3px; padding: 3px 9px; font: 12px var(--mono); background: var(--paper); }
.msg { border: 1.5px solid var(--ink-3); border-radius: 3px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
.lnk { text-decoration: underline; font-family: var(--mono); font-size: 12px; }
.mail { flex: 1; display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
.mail .list { border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; }
.mail .item { padding: 12px 16px; border-bottom: 1px solid var(--fill-2); font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.mail .item.on { background: var(--fill); border-left: 4px solid var(--ink); }
.mail .read { padding: 24px 34px; display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<script src="../../lib/wire.js"></script>
<script>
/* Area 4 · Invoicing and payments. Cards 4.1 (video), 4.2 (picture), 4.3 (video), 4.4 (picture), 4.5 (picture). */
const SECTION = "Version 1 · Invoicing and payments";
const DEP = PRICE / 2;          // 1,009.50
const BAL = PRICE - DEP;        // 1,009.50

const S = {
  screen: "title", who: null, title: "",
  hl: false, closed: false, hint: false,
  inv: "draft", email: false,
  pay: { stage: "form", filled: 0 },
  notes: "",
};
const go = (screen, who) => { S.screen = screen; S.who = who; render(); };

function whoTag(kind) {
  if (kind === "cust-mail") { const w = $("#who"); w.hidden = false; w.innerHTML = `<span class="av">CU</span><span><b>Customer</b> · their email inbox</span>`; return; }
  if (kind === "cust-pay") { const w = $("#who"); w.hidden = false; w.innerHTML = `<span class="av">CU</span><span><b>Customer</b> · paying online</span>`; return; }
  if (kind === "cust-doc") { const w = $("#who"); w.hidden = false; w.innerHTML = `<span class="av">CU</span><span><b>Customer</b> · the invoice they get</span>`; return; }
  setWho(kind);
}

// plain browser window (customer side)
function browser(url, body) {
  return `<div class="frame"><div class="frame-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">${url}</span></div>${body}</div>`;
}

/* ---------- owner: job board ---------- */
function board() {
  const jobs = JOBS.map((j) => (j.no === "G-1048" ? { ...j, stage: S.closed ? 5 : 4, note: S.closed ? "" : "Needs review" } : j));
  const cols = T.stages.map((s, i) => {
    const cs = jobs.filter((j) => j.stage === i);
    return `<div class="col"><div class="col-head"><span>${s}</span><span>${cs.length}</span></div><div class="cards">${cs.map((j) => boardCard(j, j.no === "G-1048" && S.hl ? "hl" : "")).join("")}</div></div>`;
  }).join("");
  return shell(T.board, `<div class="head"><div><h2>${T.board}</h2><div class="meta">Every active ${T.work.toLowerCase()} in the division</div></div>
    <div class="btns"><div class="seg"><button class="on">Board</button><button>List</button><button>Schedule</button></div><button class="btn primary">+ ${T.work}</button></div></div><div class="board">${cols}</div>`, "board");
}

/* ---------- owner: job details, waiting for review ---------- */
function job() {
  const status = S.closed ? `<span class="pill solid">${T.stages[5]}</span>` : `<span class="pill dash">Needs review</span>`;
  const btns = S.closed
    ? `${status}<button class="btn primary" data-k="open-draft">Open draft invoice</button>`
    : `${status}<button class="btn" data-k="send-back">Send back</button><button class="btn primary" data-k="close-job">Review and close</button>`;
  const hint = S.hint ? `<div class="hint pop" style="right:24px;top:70px"><strong>Send back</strong><div class="small muted" style="margin-top:4px">Returns it to Technician 1 with a note saying what to fix. It stays in "${T.stages[4]}" until they send it for review again.</div></div>` : "";
  const body = `<div class="head"><div><div class="crumb">${T.works} › G-1048</div><h2>Ridgeline Plumbing · Unit 14 full wrap</h2><div class="meta">${T.asset}: 2024 Ford Transit 250 · Assigned: Technician 1 · Stage: ${T.stages[S.closed ? 5 : 4]}</div></div>
    <div class="btns">${btns}</div></div>${hint}
    <div class="cols" style="margin-top:0;grid-template-columns:1fr 340px">
      <div class="box"><h3>Completion photos · from the technician</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px" data-k="photos">${["Driver side", "Passenger side", "Rear doors"].map((c) => `<div><div class="ph" style="aspect-ratio:4/3"></div><div class="small muted" style="margin-top:4px">${c}</div></div>`).join("")}</div>
        <div class="small muted" style="margin-top:10px">Uploaded Nov 2, 3:52 PM · Sent for review by Technician 1</div></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="box" data-k="costing"><h3>Estimated vs. actual</h3>
          <div class="tbl"><table><thead><tr><th></th><th class="num">Estimated</th><th class="num">Actual</th></tr></thead><tbody>
            <tr><td>Design hours</td><td class="num">4.0</td><td class="num">3.5</td></tr>
            <tr><td>Install hours</td><td class="num">9.0</td><td class="num">9.1</td></tr>
            <tr><td>Materials</td><td class="num">${money(379.3)}</td><td class="num">${money(391.4)}</td></tr>
          </tbody></table></div>
          <div class="small muted" style="margin-top:8px">Hours from the job timers. Materials as entered on the job.</div></div>
        <div class="box"><h3>Notes</h3><div class="small">Oct 30 · Printing done, laminating overnight.</div><div class="small" style="margin-top:6px">Nov 2 · Install done. Fuel door clear.</div></div>
      </div></div>`;
  return shell(T.works, body, "jobs/G-1048");
}

/* ---------- owner: invoice in the app ---------- */
const BILL_TO = "billing@ridgelineph.com";
const PAYLINK = `<span class="lnk">pay.otcfleet.com/OTC-G-0412</span>`;
const SUBJECT = "Invoice OTC-G-0412 from OTC Fleet Graphix";
// message text as it comes out of the Invoice email template (Settings › Email templates, picture 8.4)
const msgBody = (link) => `Hello Ridgeline Plumbing &amp; Heating,<br><br>Your invoice OTC-G-0412 for <strong>${money(BAL)}</strong> is attached. You can pay by card here: ${link}<br><br>Thank you for your business.<br>OTC Fleet Graphix`;

/* ---------- owner: email send window ---------- */
function emailModal() {
  return `<div class="scrim"><div class="modal pop" style="width:640px" data-k="email-modal">
    <h4>Email invoice OTC-G-0412</h4>
    <div class="field"><label>To</label><div class="input">${BILL_TO} <span class="small muted">· billing contact</span></div></div>
    <div class="field"><label>CC</label><div class="input" style="color:var(--ink-3)">Optional</div></div>
    <div class="field"><label>Subject</label><div class="input" data-k="email-subj">${SUBJECT}</div></div>
    <div class="field" style="align-items:start"><label style="padding-top:8px">Message</label><div class="msg" data-k="email-msg">${msgBody(PAYLINK)}</div></div>
    <div class="field"><label></label><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center" data-k="email-chips"><span class="chip">▤ OTC-G-0412.pdf · PDF attached</span><span class="small">Pay by card link included</span></div></div>
    <div class="field"><label></label><div class="small muted" data-k="email-reply">Replies go to: owner's inbox · Text from the Invoice email template, edit it before sending if needed</div></div>
    <div class="btns"><button class="btn">Cancel</button><button class="btn primary" data-k="email-send">Send</button></div>
  </div></div>`;
}

function invoice() {
  const st = S.inv;
  const pill = { draft: `<span class="pill dash">Draft</span>`, sent: `<span class="pill">Sent</span>`, paid: `<span class="pill solid">Paid</span>` }[st];
  const modal = S.email ? emailModal() : "";
  const payBox = st === "draft" ? "Not sent yet" : st === "sent" ? `Waiting for payment<div style="margin-top:6px" class="muted">The email has a pay-by-card link</div>` : `<span class="pill solid">Paid by card</span><div style="margin-top:6px">Nov 5 · ${money(BAL)}</div>`;
  const sendLog = st === "draft" ? `<span class="muted">Not emailed yet</span>` : `<div class="rowin" data-k="sendlog">Emailed to ${BILL_TO} · Nov 3, 9:12 AM · by Owner</div>`;
  const body = `<div class="head"><div><div class="crumb">Invoices › OTC-G-0412</div><h2>Invoice OTC-G-0412 ${pill}</h2><div class="meta">Created when G-1048 was closed · Ridgeline Plumbing &amp; Heating</div></div>
    <div class="btns"><button class="btn">Edit</button><button class="btn">Download PDF</button>${st === "draft" ? `<button class="btn primary" data-k="email-inv">Email invoice</button>` : ""}</div></div>
    <div class="cols" style="margin-top:0">
      <div class="box" style="padding:18px">
        <div style="display:flex;justify-content:space-between"><div class="logo">LOGO</div><div class="small" style="text-align:right">Bill to<br><strong>Ridgeline Plumbing &amp; Heating</strong><br>Customer PO: 7781</div></div>
        <div class="tbl" style="margin-top:16px"><table><thead><tr><th>Description</th><th class="num">Amount</th></tr></thead>
          <tbody><tr><td>Unit 14 · 2024 Ford Transit 250 · full wrap<div class="small muted">Design, print, laminate and install</div></td><td class="num">${money(PRICE)}</td></tr></tbody></table></div>
        <div class="kv" style="max-width:320px;margin:14px 0 0 auto" data-k="inv-totals"><dt>Subtotal</dt><dd>${money(PRICE)}</dd><dt>Sales tax</dt><dd>per settings</dd><dt>Deposit received Oct 26</dt><dd>${money(-DEP)}</dd>${st === "paid" ? `<dt>Paid by card Nov 5</dt><dd>${money(-BAL)}</dd>` : ""}<div class="rule"></div>
          <dt><strong>Balance due</strong></dt><dd data-k="balance"><strong>${money(st === "paid" ? 0 : BAL)}</strong></dd></div>
        <div class="box" style="margin-top:16px;border-style:dashed"><h3>Other unpaid invoices</h3><div class="kv"><dt>OTC-G-0398 · Unit 9 decal refresh · due Nov 26</dt><dd>$420.00</dd><div class="rule"></div><dt><strong>Total of other unpaid invoices</strong></dt><dd><strong>$420.00</strong></dd></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="box" data-k="emailbox"><h3>Email</h3><div class="small">${sendLog}</div></div>
        <div class="box" data-k="paybox"><h3>Payment</h3><div class="small">${payBox}</div></div>
        <div class="box"><h3>Job</h3><div class="small">G-1048 · Unit 14 full wrap<br><span class="muted">Completed Nov 2</span></div></div>
      </div></div>${modal}`;
  return shell("Invoices", body, "invoices/OTC-G-0412");
}

/* ---------- owner: invoices list ---------- */
const INVOICES = [
  ["OTC-G-0412", "Ridgeline Plumbing & Heating", "G-1048 · Unit 14 full wrap", "Nov 3", PRICE, "card"],
  ["OTC-G-0411", "Brightway Movers", "G-1046 · Rear door graphics", "Nov 2", 1150, "open"],
  ["OTC-G-0410", "Keystone Dairy Co-op", "G-1039 · Office door lettering", "Oct 30", 310, "open"],
  ["OTC-G-0407", "Keystone Dairy Co-op", "G-1036 · Tanker DOT lettering, Unit 5", "Oct 23", 925, "open"],
  ["OTC-G-0401", "Keystone Dairy Co-op", "G-1031 · Tanker DOT lettering, Unit 3", "Oct 15", 1240, "open"],
  ["OTC-G-0398", "Ridgeline Plumbing & Heating", "G-1041 · Unit 9 decal refresh", "Oct 27", 420, "open"],
];
function invoiceList(modal = "") {
  const rows = INVOICES.map(([no, c, j, d, total, st]) => {
    const isPaid = st === "card" && S.inv === "paid";
    const paid = no === "OTC-G-0412" ? (isPaid ? PRICE : DEP) : 0;
    const status = isPaid ? `<span class="pill solid">Paid</span>` : no === "OTC-G-0412" ? `<span class="pill">Sent</span>` : `<span class="pill">Open</span>`;
    const lastPay = no === "OTC-G-0412" ? (isPaid ? "Card · Nov 5" : "Deposit · Oct 26") : "—";
    return `<tr class="${no === "OTC-G-0412" && isPaid ? "rowin" : ""}" ${no === "OTC-G-0412" ? `data-k="row-0412"` : ""}><td class="num" style="text-align:left">${no}</td><td>${c}</td><td>${j}</td><td>${d}</td><td class="num">${money(total)}</td><td class="num">${money(paid)}</td><td class="num"><strong>${money(total - paid)}</strong></td><td>${lastPay}</td><td>${status}</td></tr>`;
  }).join("");
  const body = `<div class="head"><div><h2>Invoices</h2><div class="meta">Open and recently paid · balances update when a payment comes in</div></div>
    <div class="btns"><div class="seg"><button>Open</button><button>Paid</button><button class="on">All</button></div><button class="btn" data-k="record">Record payment</button></div></div>
    <div class="tbl"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Job</th><th>Sent</th><th class="num">Total</th><th class="num">Paid</th><th class="num">Balance</th><th>Last payment</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>${modal}`;
  return shell("Invoices", body, "invoices");
}

/* ---------- customer: card payment page ---------- */
function payPage() {
  const p = S.pay, f = (i, v, ph) => `<div class="input" style="${p.filled > i ? "" : "color:var(--ink-3)"}">${p.filled > i ? v : ph}</div>`;
  const inner = p.stage === "done"
    ? `<div class="done pop" style="margin:0;padding:30px"><strong style="font-size:20px">Payment received</strong><span>${money(BAL)} paid on invoice OTC-G-0412</span><span class="small muted">Thank you. You can close this page.</span></div>`
    : `<div class="field"><label>Name on card</label>${f(0, "Ridgeline Plumbing &amp; Heating", "Name")}</div>
       <div class="field"><label>Card number</label>${f(1, "•••• •••• •••• 4242", "1234 1234 1234 1234")}</div>
       <div class="field"><label>Expires · CVC</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${f(2, "08 / 28", "MM / YY")}${f(2, "•••", "CVC")}</div></div>
       <div class="field"><label>Billing ZIP</label>${f(3, "17601", "ZIP")}</div>
       <button class="wide solid" data-k="pay-now">Pay ${money(BAL)}</button>`;
  const body = `<div style="flex:1;display:grid;place-items:center">
    <div class="doc" style="width:560px;padding:26px 30px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">LOGO</div><span class="small muted">Secure card payment</span></div>
      <div><div class="crumb">OTC Fleet Graphix · Invoice OTC-G-0412</div><div style="font:600 30px var(--mono)">${money(BAL)}</div><div class="small muted">Balance due for Unit 14 · full wrap</div></div>
      ${inner}</div></div>`;
  return browser("pay.otcfleet.com/OTC-G-0412", body);
}

/* ---------- customer: their email inbox ---------- */
function custMail() {
  const others = [
    ["Lancaster Supply Co.", "Your order has shipped", "Nov 2"],
    ["Keystone Fuel Card", "October statement is ready", "Nov 1"],
    ["Susquehanna Insurance", "Policy renewal reminder", "Oct 30"],
  ];
  const body = `<div class="mail">
    <div class="list"><div class="item" style="font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)">Inbox · ${BILL_TO}</div>
      <div class="item on"><div style="display:flex;justify-content:space-between"><strong>OTC Fleet Graphix</strong><span class="small">9:12 AM</span></div><div>${SUBJECT}</div><div class="small muted">▤ OTC-G-0412.pdf</div></div>
      ${others.map(([f, t, d]) => `<div class="item"><div style="display:flex;justify-content:space-between"><span>${f}</span><span class="small muted">${d}</span></div><div class="muted">${t}</div></div>`).join("")}</div>
    <div class="read">
      <div><div style="font:600 21px var(--ui)">${SUBJECT}</div>
        <div class="small" style="margin-top:8px"><span class="muted">From</span> <strong data-k="mail-from">OTC Fleet Graphix</strong> · <span class="muted">to</span> ${BILL_TO} · Nov 3, 9:12 AM</div></div>
      <div style="max-width:640px;line-height:1.55;font-size:14.5px">${msgBody(PAYLINK)}</div>
      <div><button class="btn primary" style="padding:10px 22px;font-size:15px" data-k="mail-pay">Pay by card</button></div>
      <div style="border-top:1.5px solid var(--fill-2);padding-top:12px;display:flex;gap:10px;align-items:center"><span class="small muted">1 attachment</span><span class="chip" data-k="mail-pdf">▤ OTC-G-0412.pdf</span></div>
    </div></div>`;
  return browser("Email · Inbox", body);
}

/* ---------- 4.2 customer-facing invoice (the PDF / printable) ---------- */
function invDoc() {
  return `<div class="doc" style="width:820px;align-self:flex-start;padding:26px 34px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="logo">LOGO</div><div class="small muted" style="margin-top:8px"><strong>OTC Fleet Graphix</strong><br>Lancaster, PA</div></div>
        <div style="text-align:right"><div style="font:700 26px var(--ui)">Invoice</div><div class="kv" style="margin-top:6px"><dt>Invoice no.</dt><dd>OTC-G-0412</dd><dt>Date</dt><dd>Nov 3</dd><dt>Due</dt><dd>Dec 3</dd></div></div></div>
      <div style="display:flex;justify-content:space-between;gap:20px" class="small">
        <div><span class="muted">Bill to</span><br><strong>Ridgeline Plumbing &amp; Heating</strong><br>Accounts payable</div>
        <div style="text-align:right"><span class="muted">Customer PO</span><br><strong style="font-family:var(--mono)">7781</strong><br><span class="muted">Job G-1048</span></div></div>
      <div class="tbl" data-k="lines"><table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead>
        <tbody><tr><td><strong>Unit 14 · 2024 Ford Transit 250 · full wrap</strong><div class="small muted">Design, print, laminate and install. Both sides and rear.</div></td><td class="num">1</td><td class="num">${money(PRICE)}</td></tr></tbody></table></div>
      <div style="display:flex;justify-content:space-between;gap:24px;align-items:flex-start">
        <div class="box" style="border-style:dashed;flex:1"><h3>Other unpaid invoices</h3><div class="kv"><dt>OTC-G-0398 · Unit 9 decal refresh · due Nov 26</dt><dd>$420.00</dd><div class="rule"></div><dt><strong>Total of other unpaid invoices</strong></dt><dd><strong>$420.00</strong></dd></div></div>
        <div class="kv" style="width:300px" data-k="totals"><dt>Subtotal</dt><dd>${money(PRICE)}</dd><dt>Sales tax</dt><dd>per settings</dd><dt>Deposit received Oct 26</dt><dd>${money(-DEP)}</dd><div class="rule"></div><dt><strong>Balance due</strong></dt><dd><strong>${money(BAL)}</strong></dd></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--ink-3);padding-top:14px">
        <span class="small muted">Questions about this invoice? Call or email the shop.</span>
        <button class="btn primary" style="padding:10px 22px;font-size:15px" data-k="pay-link">Pay by card</button></div>
    </div>`;
}
function custInvoice(notes = true) {
  const body = `<div style="flex:1;display:flex;gap:40px;padding:22px 40px;min-height:0;background:var(--fill);${notes ? "" : "justify-content:center"}">
    ${invDoc()}
    ${notes ? `
    <div class="notes" style="position:static;padding-top:30px">
      <div class="note"><span class="badge">1</span><span>One line per vehicle. The materials and hours behind it stay inside the app.</span></div>
      <div class="note"><span class="badge">2</span><span>Deposit already taken off. Their PO number is printed at the top.</span></div>
      <div class="note"><span class="badge">3</span><span>Sales tax: rates still to come from accounting, so it reads "per settings" for now.</span></div>
    </div>` : ""}</div>`;
  return browser("OTC-G-0412.pdf", body);
}

/* ---------- 4.4 record payment window ---------- */
function recordModal() {
  const rows = [
    ["OTC-G-0401", "Tanker DOT lettering, Unit 3", 1240, true],
    ["OTC-G-0407", "Tanker DOT lettering, Unit 5", 925, true],
    ["OTC-G-0410", "Office door lettering", 310, false],
  ];
  return `<div class="scrim"><div class="modal" style="width:640px">
    <h4>Record payment</h4>
    <div class="field"><label>Customer</label><div class="input">Keystone Dairy Co-op</div></div>
    <div class="field"><label>Method</label><div><div class="seg"><button class="on">Check</button><button>Bank transfer</button><button>Cash</button></div></div></div>
    <div class="field"><label>Check number</label><div class="input" style="font-family:var(--mono)">10482</div></div>
    <div class="field"><label>Amount received</label><div class="input" style="font-family:var(--mono)">${money(2165)}</div></div>
    <div class="field"><label>Date received</label><div class="input">Nov 9</div></div>
    <div><div class="p-h" style="margin-bottom:6px">Apply to open invoices</div>
      <div class="tbl"><table><thead><tr><th></th><th>Invoice</th><th>Job</th><th class="num">Balance</th><th class="num">Apply</th></tr></thead><tbody>
      ${rows.map(([no, j, b, on]) => `<tr><td style="width:30px"><span class="check ${on ? "on" : ""}">${on ? "✓" : ""}</span></td><td style="font-family:var(--mono)">${no}</td><td>${j}</td><td class="num">${money(b)}</td><td class="num">${on ? money(b) : "—"}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="kv" style="max-width:260px;margin:10px 0 0 auto"><dt>Applied</dt><dd>${money(2165)}</dd><dt>Left over</dt><dd>${money(0)}</dd></div></div>
    <div class="btns"><button class="btn">Cancel</button><button class="btn primary">Save payment</button></div>
  </div></div>`;
}

/* ---------- 4.5 Settings › QuickBooks Online ---------- */
function qbSettings() {
  const log = [
    ["Nov 9, 3:05 PM", "Payment", "Check #10482 · OTC-G-0401, OTC-G-0407", "Keystone Dairy Co-op", 2165],
    ["Nov 5, 4:12 PM", "Payment", "Card · OTC-G-0412", "Ridgeline Plumbing & Heating", BAL],
    ["Nov 3, 9:12 AM", "Invoice", "OTC-G-0412", "Ridgeline Plumbing & Heating", PRICE],
    ["Nov 2, 2:18 PM", "Invoice", "OTC-G-0411", "Brightway Movers", 1150],
    ["Oct 30, 11:02 AM", "Invoice", "OTC-G-0410", "Keystone Dairy Co-op", 310],
    ["Oct 26, 10:15 AM", "Payment", "Deposit · G-1048", "Ridgeline Plumbing & Heating", DEP],
  ];
  const body = `<div class="head"><div><div class="crumb">Settings › QuickBooks Online</div><h2>QuickBooks Online</h2><div class="meta">Invoices and payments are sent to QuickBooks so the books stay up to date</div></div>
    <div class="btns"><button class="btn">Send now</button><button class="btn">Disconnect</button></div></div>
    <div class="cols" style="margin-top:0;grid-template-columns:330px 1fr">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="box"><h3>Connection</h3><div class="kv"><dt>Status</dt><dd><span class="pill solid">Connected</span></dd><dt>Company file</dt><dd>OTC Fleet Services</dd><dt>Connected</dt><dd>Oct 19</dd><dt>Last sent</dt><dd>Nov 9, 3:05 PM</dd></div></div>
        <div class="box" style="position:relative"><h3>What gets sent</h3>
          <div class="flowline"><span>Invoices</span><span class="grow"></span><span class="arrow">→</span><span>QuickBooks</span></div>
          <div class="flowline"><span>Payments</span><span class="grow"></span><span class="arrow">→</span><span>QuickBooks</span></div>
          <div class="small muted" style="margin-top:8px">Sent when an invoice is emailed and when a payment is recorded.</div></div>
        <div class="note" style="margin-left:6px"><span class="badge">?</span><span>two-way? Still deciding if anything should come back from QuickBooks.</span></div>
      </div>
      <div><div class="p-h" style="margin-bottom:8px">Recently sent</div>
        <div class="tbl"><table><thead><tr><th>When</th><th>Type</th><th>Record</th><th>Customer</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody>
        ${log.map(([w, t, r, c, a]) => `<tr><td>${w}</td><td>${t}</td><td>${r}</td><td>${c}</td><td class="num">${money(a)}</td><td><span class="pill">Sent ✓</span></td></tr>`).join("")}
        </tbody></table></div></div>
    </div>`;
  return shell("Settings", body, "settings/quickbooks");
}

function render() {
  const views = {
    title: () => cardScreen(SECTION, S.title),
    board, job, invoice, invoices: () => invoiceList(), mail: custMail, pay: payPage,
    custInvoice, record: () => invoiceList(recordModal()), qb: qbSettings,
  };
  $("#root").innerHTML = views[S.screen]();
  whoTag(S.who);
}
const titleScene = (t) => { parkCursor(); S.title = t; go("title", null); };

const SCENES = {
  /* 4.1 Review and close the finished job */
  async "4.1-title"() { titleScene("Review and close the finished job"); },
  async "4.1-board"() {
    S.closed = false; S.hl = false; S.hint = false;
    go("board", "owner");
    await wait(1500);
    S.hl = true; render();
    await moveTo("card-G-1048", 0, 0, 900);
    await wait(1600);
    await click("card-G-1048", () => { S.hl = false; S.screen = "job"; }, 600);
  },
  async "4.1-check"() {
    await moveTo("photos", 0, 0, 800); await wait(2600);
    await moveTo("costing", 0, 10, 800); await wait(2800);
  },
  async "4.1-sendback"() {
    await moveTo("send-back", 0, 0, 800);
    S.hint = true; render();
    await wait(3600);
    S.hint = false; render();
  },
  async "4.1-close"() {
    await click("close-job", () => (S.closed = true), 200);
    toast("Job completed · draft invoice created");
    await wait(1800);
    await click("open-draft", () => { S.inv = "draft"; S.screen = "invoice"; }, 600);
    await moveTo("inv-totals", 0, 0, 900);
    await wait(1800);
  },

  /* 4.3 Email the invoice and get paid by card */
  async "4.3-title"() { titleScene("Email the invoice, get paid by card"); },
  async "4.3-send"() {
    S.inv = "draft"; S.email = false;
    go("invoice", "owner");
    await wait(500);
    await click("email-inv", () => (S.email = true), 900);
    await moveTo("email-subj", 0, 0, 600); await wait(700);
    await moveTo("email-msg", 0, 0, 600); await wait(1500);
    await moveTo("email-chips", -80, 0, 600); await wait(900);
    await moveTo("email-reply", -120, 0, 500); await wait(700);
    await click("email-send", () => { S.email = false; S.inv = "sent"; }, 100);
    toast("Invoice emailed");
    await moveTo("sendlog", 0, 0, 700);
    await wait(1200);
  },
  async "4.3-open"() {
    parkCursor();
    go("mail", "cust-mail");
    await wait(1000);
    await moveTo("mail-from", 0, 0, 800); await wait(700);
    await moveTo("mail-pdf", 0, 0, 700); await wait(700);
    await click("mail-pay", () => { S.pay = { stage: "form", filled: 0 }; S.screen = "pay"; S.who = "cust-pay"; }, 500);
  },
  async "4.3-pay"() {
    for (let i = 1; i <= 4; i++) { S.pay.filled = i; render(); await wait(450); }
    await click("pay-now", () => (S.pay.stage = "done"), 1300);
  },
  async "4.3-paid"() {
    parkCursor();
    S.inv = "paid"; go("invoice", "owner");
    await wait(500);
    toast("Payment received · balance $0.00");
    await moveTo("balance", 0, 0, 800);
    await wait(1000);
    await click("nav-invoices", () => (S.screen = "invoices"), 600);
    await moveTo("row-0412", 200, 0, 800);
    await wait(1400);
  },
};

const PICTURES = {
  async "4.2"() { go("custInvoice", "cust-doc"); },
  async "4.4"() { S.inv = "paid"; go("record", "owner"); },
  async "4.5"() { go("qb", "owner"); },
};
boot();
</script>
