<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doing the job</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="../../lib/wire.css">
<style>
/* handwritten callouts (same as v1-walkthrough-sample.html) */
.note { font-family: var(--hand); color: var(--pencil); font-size: 19px; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; }
.note .badge, .mark { flex: none; width: 26px; height: 26px; border: 1.5px solid var(--pencil); border-radius: 50%; display: inline-grid; place-items: center; font: 700 14px var(--hand); color: var(--pencil); }
.mark { vertical-align: middle; margin-left: 6px; }
.callout { position: absolute; z-index: 8; background: var(--paper); border: 1.5px dashed var(--pencil); border-radius: 4px; padding: 8px 12px; max-width: 330px; }
/* side-by-side panels */
.pair { position: absolute; inset: 0; display: grid; gap: 28px; }
.pane { position: relative; min-width: 0; }
.pane-label { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.pane-body { position: absolute; inset: 26px 0 0 0; }
.slim .nav { display: none; }
.slim .app { grid-template-columns: 1fr; }
.slim .search { display: none; }
.slim .screen { padding: 16px 18px; }
.slim .head h2 { font-size: 18px; }
.gap { display: flex; flex-direction: column; gap: 12px; }
.missing { border: 1.5px dashed var(--pencil); border-radius: 3px; padding: 10px 12px; }
/* compact board for 3.1 */
.with-panel .card .no { white-space: nowrap; }
.with-panel { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
.with-panel .board { gap: 6px; }
.with-panel .col { min-height: 600px; }
.with-panel .card { font-size: 12px; padding: 7px; }
.with-panel .col-head { font-size: 9.5px; padding: 7px 6px; }
.drawer { border: 2px solid var(--ink); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 6px 6px 0 var(--fill-2); background: var(--paper); }
.pane .phone { transform: scale(.94); }
.drawer h3.dt { margin: 0; font-size: 17px; }
</style>
</head>
<body>
<script src="../../lib/wire.js"></script>
<script>
/* Section 3 · Doing the job. Pictures 3.1, 3.2, 3.5. Screens match doing-the-job.mp4 (screens.html techShell/techBoard/techJob/techPhone/techTime). */
const S = { screen: "title", who: null };
const go = (screen, who) => { S.screen = screen; S.who = who; render(); };

// The technician's own jobs (same as the video).
const MY_JOBS = [
  { no: "G-1048", cust: "Ridgeline Plumbing", what: "Unit 14 · full wrap", who: "T1", date: "Today", pri: "High", stage: 4 },
  { no: "G-1044", cust: "Keystone Dairy Co-op", what: "Tanker DOT lettering", who: "T1", date: "Tomorrow", pri: "High", stage: 3 },
  { no: "G-1046", cust: "Brightway Movers", what: "Rear door graphics", who: "T1", date: "Nov 4", pri: "Normal", stage: 2 },
  { no: "G-1052", cust: "Lancaster Kitchen Supply", what: "Box truck logo kit", who: "T1", date: "Nov 5", pri: "Normal", stage: 0 },
];
const clockedIn = `<span class="pill solid">Clocked in 7:02 AM</span>`;

/* ---------- 3.1 My jobs at the shop computer ---------- */
function myJobs() {
  const cols = T.stages.map((s, i) => {
    const cs = MY_JOBS.filter((j) => j.stage === i);
    return `<div class="col"><div class="col-head"><span>${s}</span><span>${cs.length}</span></div><div class="cards">${cs.map((j) => boardCard(j, j.no === "G-1048" ? "hl" : "")).join("")}</div></div>`;
  }).join("");
  const drawer = `<div class="drawer">
    <div><div class="crumb">G-1048 · ${T.stages[4]}</div><h3 class="dt">Ridgeline Plumbing · Unit 14 full wrap</h3>
      <div class="meta">${T.asset}: 2024 Ford Transit 250 · Install date: today · Assigned: Technician 1</div></div>
    <button class="btn primary" style="align-self:flex-start">Start timer · Installation</button>
    <div class="box"><h3>Instructions</h3><div class="small">Wrap both sides and the rear. Keep the logo clear of the fuel door. Customer drops the van at 7:30 AM.</div></div>
    <div class="box"><h3>Files</h3><div class="gap" style="gap:8px"><div class="file"><div class="ph"></div>Proof v3 (approved).pdf</div><div class="file"><div class="ph"></div>Measurements.jpg</div><div class="file"><div class="ph"></div>Panel layout.pdf</div></div></div>
    <div class="box"><h3>Notes</h3><div class="small">Oct 30 · Printing done, laminating overnight.</div></div>
    <div class="box"><h3>Completion photos</h3><div class="small muted">None yet. Add them from the phone, or upload them here.</div></div>
  </div>`;
  const body = `<div class="head"><div><h2>${T.board}</h2><div class="meta">Showing only ${T.works.toLowerCase()} assigned to you · no prices</div></div>
    <div class="btns"><span class="pill solid">Assigned to me</span><div class="seg"><button class="on">Board</button><button>List</button><button>Schedule</button></div></div></div>
    <div class="with-panel"><div class="board">${cols}</div>${drawer}</div>`;
  return techShell("My jobs", body, "my-jobs/G-1048", clockedIn);
}

/* ---------- 3.2 Clock in and out ---------- */
function clockPair() {
  const deskBody = `<div class="head"><div><h2>My time · today</h2><div class="meta">Mon Nov 2, 11:40 AM · The owner reviews and approves this</div></div></div>
    <div class="gap">
      <div class="tbl"><table><thead><tr><th>Clock punches</th><th>Where</th><th class="num">Time</th></tr></thead><tbody>
        <tr><td>Clock in</td><td>Shop computer</td><td class="num">7:02 AM</td></tr>
        <tr><td>Clock out</td><td class="muted">Not yet</td><td class="num">—</td></tr>
        <tr><td><strong>Hours so far</strong></td><td></td><td class="num"><strong>4.6 h</strong></td></tr>
      </tbody></table></div>
      <div class="tbl" style="border-style:dashed"><table><thead><tr><th>Job time · inside those hours</th><th class="num">Hours</th></tr></thead><tbody>
        <tr><td>G-1048 · Ridgeline · Installation <span class="pill">Timer running</span></td><td class="num">3.9</td></tr>
        <tr><td>G-1044 · Keystone Dairy · Prep</td><td class="num">0.5</td></tr>
      </tbody></table></div>
    </div>`;
  const desk = `<div class="slim" style="position:absolute;inset:0">${techShell("My time", deskBody, "my-time",
    `<span class="pill solid" data-k="desk-clock">Clocked in 7:02 AM</span><button class="btn">Clock out</button>`)}</div>`;
  const phoneBody = `<div class="p-sec" style="align-items:center;text-align:center;padding:18px 6px">
      <div class="p-h">Mon Nov 2</div><div style="font:600 34px var(--mono)">3:32 PM</div>
      <span class="pill dash">Clocked out</span></div>
    <div class="p-sec"><button class="wide solid">Clock in</button><div class="small muted" style="text-align:center">One tap for the day. Job timers are separate.</div></div>
    <div class="p-sec"><div class="p-h">Today's punches</div>
      <div style="display:flex;justify-content:space-between" class="small"><span>Clock in · shop computer</span><span class="num">7:02 AM</span></div>
      <div style="display:flex;justify-content:space-between" class="small"><span>Clock out · this phone</span><span class="num">3:32 PM</span></div>
      <div class="rule"></div>
      <div style="display:flex;justify-content:space-between"><strong>Hours today</strong><strong class="num">8.5 h</strong></div></div>
    <div class="p-sec" style="border:0"><div class="p-h">This week</div>
      <div style="display:flex;justify-content:space-between" class="small"><span>Mon Nov 2</span><span class="num">8.5 h</span></div>
      <div class="small muted">Waiting for the owner to approve</div></div>`;
  return `<div class="pair" style="grid-template-columns:1fr 430px">
    <div class="pane"><div class="pane-label">At the shop computer · top bar</div><div class="pane-body">${desk}</div>
      <div class="callout" style="right:24px;top:128px;max-width:560px"><div class="note"><span class="badge">1</span><span>↑ Clock in once for the day, from the top bar or the phone.</span></div></div>
      <div class="callout" style="left:24px;top:470px;max-width:420px"><div class="note"><span class="badge">2</span><span>Job timers are separate. They sit inside the day's hours, never on top.</span></div></div></div>
    <div class="pane"><div class="pane-label">On a phone · later that day</div><div class="pane-body">${phoneFrame("Clock", phoneBody, `<span class="av">T1</span>`)}</div></div>
  </div>`;
}

/* ---------- 3.5 What a technician can't see ---------- */
function ownerJob() {
  const lines = WRAP.map((r) => `<tr><td>${r[0]}</td><td class="num">${r[1]} ${r[2]}</td><td class="num">${money(r[1] * r[3])}</td><td class="num">${money(r[1] * r[4])}</td></tr>`).join("");
  const body = `<div class="head"><div><div class="crumb">${T.works} › G-1048</div><h2>Ridgeline Plumbing · Unit 14 full wrap</h2>
      <div class="meta">${T.asset}: 2024 Ford Transit 250 · Assigned: Technician 1 · Stage: ${T.stages[4]}</div></div></div>
    <div class="gap">
      <div class="box"><h3>Instructions</h3><div class="small">Wrap both sides and the rear. Keep the logo clear of the fuel door.</div></div>
      <div class="tbl"><table><thead><tr><th>Line items <span class="mark">1</span></th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Price</th></tr></thead><tbody>${lines}
        <tr class="group"><td>Total</td><td></td><td class="num">${money(COST)}</td><td class="num">${money(PRICE)}</td></tr></tbody></table></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="box"><h3>Margin <span class="mark">2</span></h3><div class="kv"><dt>Price</dt><dd>${money(PRICE)}</dd><dt>Cost</dt><dd>${money(COST)}</dd><div class="rule"></div><dt><strong>Margin</strong></dt><dd><strong>${money(PRICE - COST)} · ${Math.round((PRICE - COST) / PRICE * 1000) / 10}%</strong></dd></div></div>
        <div class="box"><h3>Estimate &amp; invoice <span class="mark">3</span></h3><div class="kv"><dt>Estimate</dt><dd>Approved Oct 26</dd><dt>Deposit paid</dt><dd>${money(PRICE / 2)}</dd><dt>Invoice</dt><dd>Draft on close</dd><dt>Other open</dt><dd>$420.00</dd></div></div>
      </div>
      <div class="box"><h3>Files</h3><div style="display:flex;gap:18px"><div class="file"><div class="ph"></div>Proof v3 (approved).pdf</div><div class="file"><div class="ph"></div>Measurements.jpg</div></div></div>
    </div>`;
  return `<div class="slim" style="position:absolute;inset:0">${shell(T.works, body, "jobs/G-1048")}</div>`;
}
function techSameJob() {
  const body = `<div class="head"><div><div class="crumb">My ${T.works.toLowerCase()} › G-1048</div><h2>Ridgeline Plumbing · Unit 14 full wrap</h2>
      <div class="meta">${T.asset}: 2024 Ford Transit 250 · Install date: today · Stage: ${T.stages[4]}</div></div>
      <div class="btns"><button class="btn primary">Start timer · Installation</button></div></div>
    <div class="gap">
      <div class="box"><h3>Instructions</h3><div class="small">Wrap both sides and the rear. Keep the logo clear of the fuel door.</div></div>
      <div class="box"><h3>Work to do</h3><div class="small">Design · Print and laminate 62 ft · Install supplies · Installation</div><div class="small muted" style="margin-top:4px">Expected install time: 9 h</div></div>
      <div class="missing"><div class="note"><span class="badge">1</span><span>No line prices or material costs</span></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="missing"><div class="note"><span class="badge">2</span><span>No margin or profit</span></div></div>
        <div class="missing"><div class="note"><span class="badge">3</span><span>No estimate, deposit or invoices</span></div></div>
      </div>
      <div class="box"><h3>Files</h3><div style="display:flex;gap:18px"><div class="file"><div class="ph"></div>Proof v3 (approved).pdf</div><div class="file"><div class="ph"></div>Measurements.jpg</div></div></div>
      <div class="box"><h3>Completion photos</h3><div class="small muted">None yet. Add them from the phone, or upload them here.</div></div>
    </div>`;
  return `<div class="slim" style="position:absolute;inset:0">${techShell("My jobs", body, "my-jobs/G-1048", clockedIn)}</div>`;
}
function splitView() {
  return `<div class="pair" style="grid-template-columns:1fr 1fr">
    <div class="pane"><div class="pane-label"><span class="av sm">OW</span>The owner sees</div><div class="pane-body">${ownerJob()}</div></div>
    <div class="pane"><div class="pane-label"><span class="av sm">T1</span>The technician sees the same job</div><div class="pane-body">${techSameJob()}</div></div>
  </div>`;
}

function render() {
  $("#root").innerHTML = {
    title: () => cardScreen("Version 1 · Doing the job", "Doing the job"),
    myjobs: myJobs, clock: clockPair, split: splitView,
  }[S.screen]();
  setWho(S.who);
}

const SCENES = {};
const PICTURES = {
  async "3.1"() { go("myjobs", "tech-desk"); },
  async "3.2"() { go("clock", null); },
  async "3.5"() { go("split", null); },
};
boot();
</script>
</body>
</html>
